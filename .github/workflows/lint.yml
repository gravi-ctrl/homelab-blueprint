name: Code Quality & Linting

on:
  push:
    branches:
      - '**'
      - '!pages'
    paths:
      - '**.sh'
      - '**.py'
  pull_request:
    branches:
      - 'main'
    paths:
      - '**.sh'
      - '**.py'
      - '.github/workflows/**'

jobs:
  # ── 1. TEST BASH SCRIPTS ───────────────────────────────────────────────────
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: >-
            node_modules
            .git
            _archive
            run_once/dotfiles

  # ── 2. TEST PYTHON SCRIPTS ─────────────────────────────────────────────────
  python-lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Ruff Linter
        run: |
          pip install ruff
          # Tell Ruff to format imports automatically (but don't fail the build if they aren't)
          ruff check . --ignore E501,BLE001,PLW1510,S110,S112,SIM115,C408,RUF010,RUF059,SIM114,SIM102,PIE810,C414,E722,PERF102,ASYNC221
